name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: words_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Init database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptest123 words_demo < demo_backend/src/main/resources/db/init_words_demo.sql

      - name: Build with Maven
        working-directory: demo_backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/words_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: test123
        run: mvn -B package --file pom.xml
